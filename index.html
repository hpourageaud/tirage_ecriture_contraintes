<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5 Tirages au sort depuis Excel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

h1{
    color:#003366;
}

button{
    padding:10px 20px;
    margin:10px 5px;
    cursor:pointer;
    font-size:16px;
}

#statut{
    margin:15px 0;
    color:#006400;
    font-weight:bold;
}

#resultats{
    margin-top:20px;
}

.resultat{
    background:#f3f3f3;
    border-left:5px solid #0078d7;
    padding:15px;
    margin-bottom:10px;
    font-size:20px;
}

table{
    border-collapse:collapse;
    margin-top:20px;
    width:100%;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

th{
    background:#0078d7;
    color:white;
}

</style>

</head>

<body>

<h1>5 tirages au sort depuis Excel</h1>

<div id="statut">
Chargement des données...
</div>

<button id="btnTirer" disabled>
Effectuer les 5 tirages
</button>

<div id="resultats"></div>

<div id="apercu"></div>

<script>

let colonnes = [];
let entetes = [];

window.onload = function(){
    chargerExcel();
};

document
    .getElementById("btnTirer")
    .addEventListener(
        "click",
        effectuerTirages
    );

async function chargerExcel(){

    try{

        // URL DU FICHIER EXCEL
        const url = "tableau_contraintes.xlsx";

        const response =
            await fetch(url);

        if(!response.ok){
            throw new Error(
                "Fichier introuvable"
            );
        }

        const data =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(
                data,
                {
                    type:"array"
                }
            );

        const feuille =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        const lignes =
            XLSX.utils.sheet_to_json(
                feuille,
                {
                    header:1
                }
            );

        entetes = lignes[0];

        colonnes = [];

        for(let c=0;c<5;c++){

            colonnes[c] = [];

            for(let l=1;l<lignes.length;l++){

                if(
                    lignes[l][c] !== undefined &&
                    lignes[l][c] !== null &&
                    lignes[l][c] !== ""
                ){

                    colonnes[c].push(
                        lignes[l][c].toString()
                    );

                }
            }
        }

        afficherApercu(lignes);

        document
            .getElementById("btnTirer")
            .disabled = false;

        document
            .getElementById("statut")
            .innerHTML =
            "✅ Données chargées avec succès";

    }
    catch(erreur){

        console.error(erreur);

        document
            .getElementById("statut")
            .innerHTML =
            "❌ Erreur lors du chargement du fichier Excel";

    }
}

function afficherApercu(data){

    let html =
        "<h2>Aperçu du fichier</h2><table>";

    for(let i=0;i<data.length;i++){

        html += "<tr>";

        for(let j=0;j<5;j++){

            const valeur =
                data[i][j] || "";

            if(i===0){

                html +=
                    "<th>" +
                    valeur +
                    "</th>";

            }else{

                html +=
                    "<td>" +
                    valeur +
                    "</td>";

            }
        }

        html += "</tr>";
    }

    html += "</table>";

    document
        .getElementById("apercu")
        .innerHTML = html;
}

function effectuerTirages(){

    let html =
        "<h2>Résultats</h2>";

    for(let i=0;i<5;i++){

        const titre =
            entetes[i] ||
            `Colonne ${i+1}`;

        if(colonnes[i].length === 0){

            html +=
            `<div class="resultat">
                ${titre} : aucune donnée
            </div>`;

            continue;
        }

        const index =
            Math.floor(
                Math.random() *
                colonnes[i].length
            );

        const gagnant =
            colonnes[i][index];

        html +=
        `<div class="resultat">
            🎉 ${titre} :
            <strong>${gagnant}</strong>
        </div>`;
    }

    document
        .getElementById("resultats")
        .innerHTML = html;
}

</script>

</body>
</html>
